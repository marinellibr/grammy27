<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Listen to the Grammy 2027 nominees, make your picks, and share your ballot in Instagram Stories." />
    <title>Grammy 2027 — Your picks. Your spotlight.</title>
    <script>
      try { var theme = localStorage.getItem('grammy27-theme'); if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme; } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
